[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsukuyomi"
version = "0.1.0"
description = "Illusion layer for AI agents — the agent never knows it's not in the real world"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["ai", "agent", "safety", "simulation", "illusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/droogdoc/tsukuyomi"
Issues = "https://github.com/droogdoc/tsukuyomi/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
